version: 0.1
component: build
timeoutInSeconds: 1000
shell: bash

  - type: Command
    name: "Build Docker Image"
    command: |
      cd ${OCI_PRIMARY_SOURCE_DIR}
      echo "Building image with tag: ${IMAGE_TAG}"
      docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .

outputArtifacts:
  - name: docker_image
    type: DOCKER_IMAGE
    location: ${IMAGE_NAME}:${IMAGE_TAG}
